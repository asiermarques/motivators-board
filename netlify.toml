# Deploys the Board to Netlify. It works the same in a clone and in an Adopter repository: `npm run build` checks the
# Configuration and writes the static site to dist/. Netlify reads the Node.js version from .nvmrc (add one to an
# Adopter repository too, with 22.12 or newer).
[build]
  command = "npm run build"
  publish = "dist"

# The Board is a single page and its state lives in the URL fragment, so no redirects are needed.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Vite puts a content hash in the name of every file in assets/, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
